# ==============================================================================
# Network tuning — AmneziaWG gateway host.
# Install as /etc/sysctl.d/99-awg-network.conf ; apply with `sysctl --system`.
#
# Kernel/FS/memory hardening is deliberately not in this file; keep it in a
# separate 60-kernel-hardening.conf if you want it.
# ==============================================================================

# ==============================================================================
# Core routing
# ==============================================================================
net.ipv4.ip_forward = 1

# Clients get `AllowedIPs = 0.0.0.0/0, ::/0` by default, so IPv6 must forward
# too — otherwise every dual-stack destination eats a Happy-Eyeballs timeout.
# Remove this (and run awg-bootstrap.sh --no-ipv6) to go v4-only; do not leave
# it half-configured.
net.ipv6.conf.all.forwarding = 1

# fq is the right qdisc for BBR, which depends on its pacing.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ==============================================================================
# Socket buffers
# ==============================================================================
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.netdev_max_backlog = 16384
net.core.optmem_max = 81920

# TCP autotuning is capped by the third field, not by rmem_max/wmem_max.
net.ipv4.tcp_rmem = 4096 262144 26214400
net.ipv4.tcp_wmem = 4096 262144 26214400

# UDP memory accounting, in pages. The tunnel is UDP.
net.ipv4.udp_mem = 786432 1048576 26777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# ==============================================================================
# Connection tracking
#
# Defaults size the table from RAM (~65k entries on a small VPS, with a 5-day
# established timeout). A NAT gateway exhausts that and the kernel starts
# dropping new connections ("nf_conntrack: table full" in dmesg).
#
# These keys only exist once nf_conntrack is loaded, which is why the installer
# also drops /etc/modules-load.d/awg.conf. systemd-sysctl.service runs after
# systemd-modules-load.service, so ordering works out.
# ==============================================================================
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_generic_timeout = 120

# ==============================================================================
# Reverse path filtering
# effective value = max(all, per-interface), so 'all' must not be 0.
#
# NOTE: per-interface keys fail if the interface does not exist. `eth0` below
# is the WAN interface name on many cloud images; change it to match
# `ip -o route show default` on your host. Loose mode (2) is correct for the
# tunnel interface, so awg0 needs no entry.
# ==============================================================================
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.lo.rp_filter = 0
net.ipv4.conf.eth0.rp_filter = 1

# ==============================================================================
# Edge hardening
# ==============================================================================
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.log_martians = 1

# Keep accepting router advertisements on the WAN even though forwarding is on;
# enabling forwarding otherwise disables RA processing and the host can lose
# its default v6 route. Same interface-name caveat as above.
net.ipv6.conf.eth0.accept_ra = 2

# ==============================================================================
# ICMP
# ==============================================================================
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ==============================================================================
# TCP state defenses
# ==============================================================================
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_fin_timeout = 20
net.ipv4.tcp_slow_start_after_idle = 0

# Keep timestamps on: BBR estimates bandwidth and RTT from timestamped samples,
# and disabling them also disables PAWS.
net.ipv4.tcp_timestamps = 1

# Detect PMTU black holes and step the MSS down instead of stalling.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_base_mss = 1024

# Limit bufferbloat on variable-latency paths
net.ipv4.tcp_notsent_lowat = 16384

# ==============================================================================
# Misc limits
# ==============================================================================
vm.max_map_count = 1048576
kernel.pid_max = 4194304
